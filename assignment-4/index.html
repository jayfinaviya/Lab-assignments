<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 4: React Profile Card using Props</title>
  <!-- React & Babel CDNs for instant GitHub Pages execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h2 {
      font-size: 1.3rem;
      color: #222222;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666666;
      margin-bottom: 25px;
    }

    .cards-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .profile-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      width: 260px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 2px solid #0066cc;
    }

    .profile-name {
      font-size: 1.2rem;
      color: #222222;
      margin-bottom: 8px;
    }

    .profile-desc {
      font-size: 0.9rem;
      color: #666666;
      line-height: 1.4;
    }

    .nav-links {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .nav-links a {
      color: #0066cc;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    // Child component receiving props
    function ProfileCard(props) {
      return (
        <div className="profile-card">
          <img src={props.imageUrl} alt={props.name} className="profile-img" />
          <h3 className="profile-name">{props.name}</h3>
          <p className="profile-desc">{props.description}</p>
        </div>
      );
    }

    // Main App component
    function App() {
      return (
        <div className="container">
          <h2>Assignment 4: React Profile Card using Props</h2>
          <p className="subtitle">
            Passes name, image URL, and description as props to a child component.
          </p>

          <div className="cards-row">
            <ProfileCard
              name="Jay Finaviya"
              imageUrl="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80"
              description="MCA student and software developer interested in web development."
            />
            <ProfileCard
              name="Alice Smith"
              imageUrl="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80"
              description="Frontend developer who loves building responsive web apps with React."
            />
          </div>

          <div className="nav-links">
            <a href="../index.html">← Back to All Assignments</a>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

</body>
</html>
