<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3: Form Validation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333333;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    h2 {
      font-size: 1.3rem;
      color: #222222;
      margin-bottom: 6px;
      text-align: center;
    }

    .description {
      font-size: 0.85rem;
      color: #666666;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
    }

    input {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: #0066cc;
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.8rem;
      min-height: 16px;
    }

    button#submitBtn {
      width: 100%;
      padding: 10px;
      background-color: #0066cc;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.15s;
    }

    button#submitBtn:hover {
      background-color: #0052a3;
    }

    .success-msg {
      margin-top: 15px;
      padding: 10px;
      background-color: #dcfce7;
      color: #16a34a;
      border: 1px solid #86efac;
      border-radius: 4px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
    }

    .nav-links {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }

    .nav-links a {
      color: #0066cc;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Assignment 3: User Registration Form</h2>
    <p class="description">Validates Name, Email, Phone, and Password using JavaScript.</p>

    <form id="regForm" onsubmit="return validateForm(event)">
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your full name">
        <span class="error-msg" id="nameError"></span>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Enter your email address">
        <span class="error-msg" id="emailError"></span>
      </div>

      <!-- Phone Field -->
      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" placeholder="Enter 10-digit phone number">
        <span class="error-msg" id="phoneError"></span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password (min 8 chars)">
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit" id="submitBtn">Register</button>
    </form>

    <div id="successMsg" class="success-msg"></div>

    <div class="nav-links">
      <a href="../index.html">← Back to All Assignments</a>
    </div>
  </div>

  <script>
    function validateForm(e) {
      e.preventDefault();

      let isValid = true;

      // Get values
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();

      // Clear previous errors
      document.getElementById('nameError').textContent = '';
      document.getElementById('emailError').textContent = '';
      document.getElementById('phoneError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      const successMsg = document.getElementById('successMsg');
      successMsg.style.display = 'none';

      // 1. Name validation
      if (name === '') {
        document.getElementById('nameError').textContent = 'Name is required';
        isValid = false;
      }

      // 2. Email validation
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      if (email === '') {
        document.getElementById('emailError').textContent = 'Email is required';
        isValid = false;
      } else if (!email.match(emailPattern)) {
        document.getElementById('emailError').textContent = 'Enter a valid email address';
        isValid = false;
      }

      // 3. Phone validation (10 digits)
      const phonePattern = /^[0-9]{10}$/;
      if (phone === '') {
        document.getElementById('phoneError').textContent = 'Phone number is required';
        isValid = false;
      } else if (!phone.match(phonePattern)) {
        document.getElementById('phoneError').textContent = 'Enter a valid 10-digit phone number';
        isValid = false;
      }

      // 4. Password validation (min 8 characters)
      if (password === '') {
        document.getElementById('passwordError').textContent = 'Password is required';
        isValid = false;
      } else if (password.length < 8) {
        document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
        isValid = false;
      }

      // Success
      if (isValid) {
        successMsg.textContent = 'Registration successful!';
        successMsg.style.display = 'block';
        document.getElementById('regForm').reset();
      }

      return false;
    }
  </script>
</body>
</html>
