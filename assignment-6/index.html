<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6: React Counter App</title>
  <!-- React & Babel CDNs for instant GitHub Pages execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .counter-wrapper {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .counter-wrapper h2 {
      font-size: 1.3rem;
      color: #222222;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #666666;
      margin-bottom: 25px;
    }

    .counter-display {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .count-value {
      font-size: 3.2rem;
      font-weight: bold;
      color: #0066cc;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-counter {
      padding: 10px 16px;
      font-size: 0.95rem;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      font-weight: 500;
      transition: background-color 0.15s;
    }

    .btn-dec {
      background-color: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }

    .btn-dec:hover {
      background-color: #fecaca;
    }

    .btn-rst {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .btn-rst:hover {
      background-color: #e2e8f0;
    }

    .btn-inc {
      background-color: #dcfce7;
      color: #16a34a;
      border: 1px solid #86efac;
    }

    .btn-inc:hover {
      background-color: #bbf7d0;
    }

    .nav-links {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
    }

    .nav-links a {
      color: #0066cc;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function CounterApp() {
      // 1. Declare state variable for counter
      const [count, setCount] = useState(0);

      // 2. Handler functions
      const increment = () => {
        setCount(count + 1);
      };

      const decrement = () => {
        setCount(count - 1);
      };

      const reset = () => {
        setCount(0);
      };

      return (
        <div className="counter-wrapper">
          <h2>Assignment 6: React Counter App</h2>
          <p className="subtitle">
            Uses React Hooks (<code>useState</code>) to increment, decrement, and reset value.
          </p>

          {/* Counter Value Display */}
          <div className="counter-display">
            <span className="count-value">{count}</span>
          </div>

          {/* Action Buttons */}
          <div className="button-group">
            <button onClick={decrement} className="btn-counter btn-dec">Decrement (-)</button>
            <button onClick={reset} className="btn-counter btn-rst">Reset</button>
            <button onClick={increment} className="btn-counter btn-inc">Increment (+)</button>
          </div>

          <div className="nav-links">
            <a href="../index.html">← Back to All Assignments</a>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CounterApp />);
  </script>

</body>
</html>
